<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Conversor de moedas</title>
</head>
<body>

  
    <img class="logo-moeda" src="./assets/img/logo-moeda.png" alt="logo imagem moeda">
  

    <!--Conteúdo principal-->
    <main class="container-principal">
        <!--Conversor real-->
        <label for="real">
           <p>Converter <span>de</span></p> 
            
            <select name="real" id="real">
                <option value="real">R$ Real Brasileiro</option>
            </select>

        </label>


        <!--Conversor dólar-->
        <label for="dolar-euro">
            <p>Converter <span>para</span></p>
            
            <select name="dolar-euro" id="dolar-euro">
                <option value="dolar">US$ Dólar americano</option>
                <option value="euro"> € Euro</option>

            </select>

        </label>

        <!--Campo para colocar valor-->
        <label for="valor">
            <p><span>Valor</span></p>
            <input class="input-currency" placeholder="R$ 10.000,00" type="text">
        </label>

        <!--Botão converter-->
        <button id="convert-btn" class="button-convert">Converter</button>

        <!--Seção da conversão-->
        <section class="convert-result">
            <div class="currency-box">
                <img src="./assets/img/logo-brasil.png" alt="logo brasil">
                <p class="currency">Real</p>
                <p class="currency-value">R$ 0,00</p>
            </div>

            <img class="arrow-img" src="./assets/img/logo-seta.png" alt="logo seta">
        
            <div class="currency-box">
                <img src="./assets/img/logo-estados-unidos.png" alt="logo estados unidos">
                <p class="currency">Dólar Americano</p>
                <p class="currency-value">US$ <span class="result-converted"> 0.0 </span></p>
            </div>
        </section>
    </main>



    <script src="./script.js"></script>
</body>
</html>
